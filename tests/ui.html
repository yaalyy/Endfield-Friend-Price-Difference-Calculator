<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>UI import smoke test</title></head>
<body>
<pre id="out">RUNNING</pre>
<iframe id="app" style="width:1400px;height:900px"></iframe>
<script>
// 运行：python -I tests/serve.py，然后打开 /tests/ui.html。会清空该源下的 localStorage。
// 使用生成的 PNG 和可手动完成的 OCR 模拟会话；真实识别由 e2e.html 测试。
const log = [];
const ok = (cond, msg) => log.push((cond ? 'ok   ' : 'FAIL ') + msg);
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 60000) { const t = Date.now(); while (Date.now() - t < ms) { const v = fn(); if (v) return v; await wait(200); } return null; }

(async () => {
    const frame = document.getElementById('app');
    try {
        localStorage.clear();
        localStorage.setItem('products', JSON.stringify([{ name: '武侠电影货组', basePrice: 1800, discount: 1 }]));
        localStorage.setItem('friends', JSON.stringify([{ name: '好友A', discounts: { '武侠电影货组': 5 } }]));
        await new Promise(r => {
            frame.addEventListener('load', r, { once: true });
            frame.src = '../docs/index.html';
        });
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const errors = [];
        win.addEventListener('error', e => errors.push(e.message));
        win.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));

        const items = [
            { name: '龙泡泡浮空艇货组', price: 3853, discount: 92.7 },
            { name: '武侠电影货组', price: 3556, discount: 77.8 },
            { name: '选剑铸炉货组', price: 3482, discount: 74.1 },
            { name: '冬虫夏笋货组', price: 2738, discount: 36.9 },
            { name: '息壤色烟花货组', price: 2473, discount: 23.6 },
            { name: '岳研避瘴茶货组', price: 2452, discount: 22.6 },
            { name: '武陵冻梨货组', price: 1895, discount: -5.3 }
        ];
        const sessions = [];
        win.OcrRecognizer.createSession = ({ onProgress = () => {} } = {}) => {
            const session = {
                runs: [], cancelled: false, disposed: false,
                run(file) {
                    onProgress({ label: '模拟识别中', progress: 0.5 });
                    return new Promise(resolve => session.runs.push({ file, resolve }));
                },
                cancel() { session.cancelled = true; },
                dispose() { session.disposed = true; }
            };
            sessions.push(session);
            return session;
        };

        const btn = await until(() => [...doc.querySelectorAll('button')].find(b => b.textContent.trim() === '图片导入'));
        ok(btn, 'import button rendered');
        btn.click();
        await wait(100);
        ok(doc.querySelector('.import-dialog'), 'import dialog opens');

        // 生成有效的 PNG，验证选图与预览流程，无需外部图片文件。
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2c2f36'; ctx.fillRect(0, 0, 32, 32);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new win.File([blob], 'ui-test.png', { type: 'image/png' });
        const input = doc.querySelector('.import-dialog input[type=file]');
        const selectFile = input => {
            const dt = new win.DataTransfer();
            dt.items.add(file);
            input.files = dt.files;
            input.dispatchEvent(new win.Event('change'));
        };
        selectFile(input);
        const firstRun = await until(() => sessions[0] && sessions[0].runs[0]);
        ok(firstRun && firstRun.file.name === 'ui-test.png', 'selected image passed to recognizer');
        firstRun.resolve(items.map(item => ({ ...item })));
        const rows = await until(() => { const r = doc.querySelectorAll('.import-table tbody tr'); return r.length ? r : null; });
        ok(rows && rows.length === 7, 'preview rows: ' + (rows ? rows.length : 0));
        const headers = [...doc.querySelectorAll('.import-table thead th')].map(th => th.textContent.trim());
        ok(JSON.stringify(headers) === JSON.stringify(['', '商品名称', '识别售价', '折扣比（%）']), 'preview columns ' + JSON.stringify(headers));
        ok(doc.querySelector('.import-tag.update'), 'existing product marked as update');
        log.push('     footer: ' + doc.querySelector('.import-dialog .dialog-footer-note').textContent.trim());

        // 只保留一行新增 + 一行更新，其它取消勾选，验证部分勾选
        const rowList = [...doc.querySelectorAll('.import-table tbody tr')];
        let keptNew = null;
        rowList.forEach(tr => {
            const name = tr.querySelector('.inline-input').value;
            const box = tr.querySelector('input[type=checkbox]');
            const keep = name === '武侠电影货组' || (!keptNew && name === '冬虫夏笋货组' && (keptNew = name));
            if (box.checked !== Boolean(keep)) box.click();
        });
        await wait(100);
        log.push('     footer after selection: ' + doc.querySelector('.import-dialog .dialog-footer-note').textContent.trim());

        // 重复名称：把新增行改成已有名称，确认按钮必须禁用
        const newRow = rowList.find(tr => tr.querySelector('.inline-input').value === '冬虫夏笋货组');
        const nameInput = newRow.querySelector('.inline-input');
        nameInput.value = '武侠电影货组'; nameInput.dispatchEvent(new win.Event('input'));
        await wait(100);
        const confirmBtn = [...doc.querySelectorAll('.import-dialog button')].find(b => b.textContent.trim() === '确认导入');
        ok(confirmBtn.disabled && doc.querySelector('.import-error'), 'duplicate name blocks confirm: ' + (doc.querySelector('.import-error') || {}).textContent);
        nameInput.value = '冬虫夏笋货组'; nameInput.dispatchEvent(new win.Event('input'));
        await wait(100);
        ok(!confirmBtn.disabled, 'confirm enabled after fixing name');

        win.confirm = () => true;
        confirmBtn.click();
        await wait(300);
        const saved = JSON.parse(localStorage.getItem('products'));
        log.push('     saved ' + JSON.stringify(saved));
        const upd = saved.find(p => p.name === '武侠电影货组');
        const add = saved.find(p => p.name === '冬虫夏笋货组');
        ok(saved.length === 2, 'only checked rows saved');
        ok(upd && upd.basePrice === 1800 && upd.discount === 77.8, 'update keeps basePrice 1800, discount 77.8');
        ok(add && add.basePrice === 2000 && add.discount === 36.9, 'new product basePrice 2000, discount 36.9');
        ok(saved.every(p => Object.keys(p).join() === 'name,basePrice,discount'), 'product shape unchanged');
        ok(JSON.parse(localStorage.getItem('friends'))[0].discounts['武侠电影货组'] === 5, 'friend discounts untouched');
        ok(!doc.querySelector('.import-dialog'), 'dialog closed after import');
        ok(sessions[0].disposed, 'recognition session disposed after import');

        // 取消：打开、选图、立即关闭，之后数据不变且无报错
        btn.click(); await wait(100);
        const input2 = doc.querySelector('.import-dialog input[type=file]');
        selectFile(input2);
        const pendingRun = await until(() => sessions[1] && sessions[1].runs[0]);
        ok(Boolean(pendingRun), 'second recognition pending before cancel');
        [...doc.querySelectorAll('.import-dialog button')].find(b => b.textContent.trim() === '取消').click();
        ok(sessions[1].disposed, 'cancel disposes pending recognition session');
        // 故意让已关闭会话仍返回结果，验证过期任务不会写回页面。
        pendingRun.resolve(items.map(item => ({ ...item })));
        await wait(100);
        ok(JSON.stringify(JSON.parse(localStorage.getItem('products'))) === JSON.stringify(saved), 'cancel during recognition changes nothing');
        ok(!doc.querySelector('.import-dialog'), 'dialog stays closed (stale task not written back)');
        ok(!errors.length, 'no page errors ' + JSON.stringify(errors));
    } catch (e) {
        log.push('ERROR ' + (e && e.stack || e));
    }
    localStorage.clear();
    const text = log.join('\n') + '\nDONE';
    document.getElementById('out').textContent = text;
    fetch('/result', { method: 'POST', body: text }).catch(() => {});
})();
</script>
</body>
</html>
